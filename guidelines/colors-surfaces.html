<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Surface roles</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:600 12px/1.3 var(--font-sans);margin-top:8px;color:var(--fg-1)}.v{font:400 11px/1.3 var(--font-sans);color:var(--fg-3)}.lbl{font:500 11px/1 var(--font-sans);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div class="row"><div class="sw" style="background:var(--bg-page);border:1px solid var(--border-1);border-radius:4px;padding:16px;height:150px"><div style="font:500 22px/1 var(--font-serif);color:var(--fg-1)">bg-page</div><div class="v" style="margin-top:6px">fg-1 · fg-2 · border-1</div><div style="margin-top:20px;background:var(--bg-surface);border:1px solid var(--border-1);border-radius:4px;padding:12px;font:500 13px var(--font-sans)">bg-surface <span style="color:var(--accent-text);font-weight:600">$12,850,000 MXN</span></div></div><div class="sw" style="background:var(--bg-inverse);border-radius:4px;padding:16px;height:150px"><div style="font:500 22px/1 var(--font-serif);color:var(--fg-inverse)">bg-inverse</div><div class="v" style="margin-top:6px;color:var(--fg-inverse-2)">fg-inverse · accent-on-dark</div><div style="margin-top:20px;background:var(--bg-inverse-raised);border:1px solid var(--border-inverse);border-radius:4px;padding:12px;font:400 30px/1 var(--font-serif);color:var(--accent-on-dark)">+500</div></div></div></body></html>
