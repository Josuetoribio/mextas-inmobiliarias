<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Moderate & architectural — 2–6px; round only for icon buttons" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Corner radii</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:600 12px/1.3 var(--font-sans);margin-top:8px;color:var(--fg-1)}.v{font:400 11px/1.3 var(--font-sans);color:var(--fg-3)}.lbl{font:500 11px/1 var(--font-sans);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div class="row"><div class="sw"><div style="height:80px;background:var(--bg-surface);border:1px solid var(--border-2);border-radius:var(--radius-xs)"></div><div class="n">radius-xs</div><div class="v">2px · buttons, inputs, badges</div></div><div class="sw"><div style="height:80px;background:var(--bg-surface);border:1px solid var(--border-2);border-radius:var(--radius-sm)"></div><div class="n">radius-sm</div><div class="v">3px · chips, tiles</div></div><div class="sw"><div style="height:80px;background:var(--bg-surface);border:1px solid var(--border-2);border-radius:var(--radius-md)"></div><div class="n">radius-md</div><div class="v">4px · cards, photos</div></div><div class="sw"><div style="height:80px;background:var(--bg-surface);border:1px solid var(--border-2);border-radius:var(--radius-lg)"></div><div class="n">radius-lg</div><div class="v">6px · sheets</div></div><div class="sw"><div style="height:80px;background:var(--bg-surface);border:1px solid var(--border-2);border-radius:var(--radius-round)"></div><div class="n">radius-round</div><div class="v">icon buttons</div></div></div></body></html>
