<!-- @dsCard group="Colors" viewport="700x200" name="Photo overlays" subtitle="Hero side-scrim and card bottom-shade over photography" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Photo overlays</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:600 12px/1.3 var(--font-sans);margin-top:8px;color:var(--fg-1)}.v{font:400 11px/1.3 var(--font-sans);color:var(--fg-3)}.lbl{font:500 11px/1 var(--font-sans);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div class="row"><div class="sw" style="position:relative;height:150px;border-radius:4px;overflow:hidden;background:url(../assets/img/hero-casa-moderna.jpg) center/cover"><div style="position:absolute;inset:0;background:var(--overlay-hero)"></div><div style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font:500 26px/1.05 var(--font-serif);color:#fff">--overlay-hero</div></div><div class="sw" style="position:relative;height:150px;border-radius:4px;overflow:hidden;background:url(../assets/img/cdmx.jpg) center/cover"><div style="position:absolute;inset:0;background:var(--overlay-card)"></div><div style="position:absolute;left:14px;bottom:12px;font:600 14px var(--font-sans);color:#fff">--overlay-card</div></div></div></body></html>
