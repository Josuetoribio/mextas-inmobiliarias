<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Layout & controls</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:600 12px/1.3 var(--font-sans);margin-top:8px;color:var(--fg-1)}.v{font:400 11px/1.3 var(--font-sans);color:var(--fg-3)}.lbl{font:500 11px/1 var(--font-sans);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="border:1px solid var(--border-1);background:var(--bg-surface);border-radius:3px;padding:12px"><div class="n" style="margin:0">--container</div><div class="v">1200px</div></div><div style="border:1px solid var(--border-1);background:var(--bg-surface);border-radius:3px;padding:12px"><div class="n" style="margin:0">--gutter</div><div class="v">20–48px</div></div><div style="border:1px solid var(--border-1);background:var(--bg-surface);border-radius:3px;padding:12px"><div class="n" style="margin:0">--section-y</div><div class="v">64–112px</div></div><div style="border:1px solid var(--border-1);background:var(--bg-surface);border-radius:3px;padding:12px"><div class="n" style="margin:0">--header-h</div><div class="v">76 → 62px</div></div><div style="border:1px solid var(--border-1);background:var(--bg-surface);border-radius:3px;padding:12px"><div class="n" style="margin:0">--control-h-sm</div><div class="v">36px</div></div><div style="border:1px solid var(--border-1);background:var(--bg-surface);border-radius:3px;padding:12px"><div class="n" style="margin:0">--control-h</div><div class="v">46px</div></div><div style="border:1px solid var(--border-1);background:var(--bg-surface);border-radius:3px;padding:12px"><div class="n" style="margin:0">--control-h-lg</div><div class="v">54px</div></div><div style="border:1px solid var(--border-1);background:var(--bg-surface);border-radius:3px;padding:12px"><div class="n" style="margin:0">--container-wide</div><div class="v">1360px</div></div></div></body></html>
