<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:600 12px/1.3 var(--font-sans);margin-top:8px;color:var(--fg-1)}.v{font:400 11px/1.3 var(--font-sans);color:var(--fg-3)}.lbl{font:500 11px/1 var(--font-sans);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div style="border-top:1px solid var(--fg-1);padding-top:10px"><div class="n" style="margin:0">ease-out</div><div class="v">cubic-bezier(.22,.61,.36,1)</div></div><div style="border-top:1px solid var(--fg-1);padding-top:10px"><div class="n" style="margin:0">dur-fast</div><div class="v">180ms · color, border</div></div><div style="border-top:1px solid var(--fg-1);padding-top:10px"><div class="n" style="margin:0">dur-base</div><div class="v">320ms · arrows, tabs</div></div><div style="border-top:1px solid var(--fg-1);padding-top:10px"><div class="n" style="margin:0">dur-slow</div><div class="v">640ms · modals, reveal</div></div><div style="border-top:1px solid var(--fg-1);padding-top:10px"><div class="n" style="margin:0">dur-image</div><div class="v">1400ms · photo zoom</div></div></div></body></html>
