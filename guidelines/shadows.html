<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:600 12px/1.3 var(--font-sans);margin-top:8px;color:var(--fg-1)}.v{font:400 11px/1.3 var(--font-sans);color:var(--fg-3)}.lbl{font:500 11px/1 var(--font-sans);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div class="row" style="gap:20px;padding:6px"><div class="sw"><div style="height:90px;background:var(--bg-surface);border-radius:4px;box-shadow:var(--shadow-1)"></div><div class="n">shadow-1</div><div class="v">resting controls</div></div><div class="sw"><div style="height:90px;background:var(--bg-surface);border-radius:4px;box-shadow:var(--shadow-2)"></div><div class="n">shadow-2</div><div class="v">card hover, dropdowns</div></div><div class="sw"><div style="height:90px;background:var(--bg-surface);border-radius:4px;box-shadow:var(--shadow-float)"></div><div class="n">shadow-float</div><div class="v">toast, compare tray</div></div><div class="sw"><div style="height:90px;background:var(--bg-surface);border-radius:4px;box-shadow:var(--shadow-3)"></div><div class="n">shadow-3</div><div class="v">modals</div></div></div></body></html>
