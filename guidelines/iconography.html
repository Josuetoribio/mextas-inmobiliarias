<!-- @dsCard group="Brand" viewport="700x170" name="Iconography" subtitle="Lucide, 1.25–1.5px stroke, gold on light / champagne on dark" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Iconography</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:600 12px/1.3 var(--font-sans);margin-top:8px;color:var(--fg-1)}.v{font:400 11px/1.3 var(--font-sans);color:var(--fg-3)}.lbl{font:500 11px/1 var(--font-sans);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div id="ic" style="display:grid;grid-template-columns:repeat(12,1fr);gap:14px;color:var(--accent-text)"></div><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script>document.getElementById('ic').innerHTML=['house','building-2','land-plot','briefcase','store','bed-double','bath','square','car','map-pin','heart','search','waves','trees','sun','shield-check','dumbbell','arrow-up-down','cooking-pot','flower-2','package','phone','calendar','arrow-right'].map(n=>'<i data-lucide="'+n+'"></i>').join('');lucide.createIcons({attrs:{'stroke-width':1.4,width:24,height:24}});</script></body></html>
