<!-- @dsCard group="Colors" viewport="700x180" name="Semantic" subtitle="Muted, earthy status colors — never saturated" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:72px;border-radius:var(--radius-sm);border:1px solid rgba(0,0,0,.06)}.n{font:600 12px/1.3 var(--font-sans);margin-top:8px;color:var(--fg-1)}.v{font:400 11px/1.3 var(--font-sans);color:var(--fg-3)}.lbl{font:500 11px/1 var(--font-sans);color:var(--fg-3);letter-spacing:.04em}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success)"></div><div class="n">--success</div><div class="v">sage</div></div><div class="sw"><div class="chip" style="background:var(--success-bg)"></div><div class="n">--success-bg</div><div class="v">sage tint</div></div><div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="n">--warning</div><div class="v">ochre</div></div><div class="sw"><div class="chip" style="background:var(--warning-bg)"></div><div class="n">--warning-bg</div><div class="v">ochre tint</div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="n">--danger</div><div class="v">terracotta</div></div><div class="sw"><div class="chip" style="background:var(--danger-bg)"></div><div class="n">--danger-bg</div><div class="v">terracotta tint</div></div></div></body></html>
