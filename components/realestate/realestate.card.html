<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Real estate</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:24px;background:var(--bg-page)}.r{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:18px}.lbl{font:500 11px/1 var(--font-sans);color:var(--fg-3);letter-spacing:.04em;width:90px;flex-shrink:0}.dark{background:var(--bg-inverse);padding:18px;border-radius:4px}</style></head><body><div id="root"></div><script type="text/babel">const { PropertyCard, PropertySpecs, LocationCard, CategoryTile, StatBlock, TrustItem, SectionHeader, AmenityItem, CompareTray, Button } = window.MextasDesignSystem_8aabb9;
const P=[{id:1,title:'Casa en Valle Real',location:'Zapopan, Jalisco',price:12850000,beds:4,baths:4.5,area:320,image:'../../assets/img/casa-valle-real.jpg',badge:'Destacada'},{id:2,title:'Departamento en Polanco',location:'Miguel Hidalgo, CDMX',price:15600000,beds:2,baths:2,area:150,image:'../../assets/img/depto-polanco.jpg',badge:'Premium'}];
function App(){const [f,setF]=React.useState({1:true});const [c,setC]=React.useState([1]);
return <div className="col" style={{gap:24}}>
<SectionHeader eyebrow="Propiedades destacadas" title="Descubre nuestras propiedades exclusivas" action={<Button variant="outline" size="sm" iconRight="ArrowRight">Ver todas</Button>}/>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>{P.map(p=><PropertyCard key={p.id} property={p} eager favorite={!!f[p.id]} onToggleFavorite={()=>setF(s=>({...s,[p.id]:!s[p.id]}))} compared={c.includes(p.id)} onToggleCompare={()=>setC(s=>s.includes(p.id)?s.filter(x=>x!==p.id):[...s,p.id])}/>)}</div>
<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}><CategoryTile icon="House" label="Casas" count={120}/><CategoryTile icon="Building2" label="Departamentos" count={85}/><CategoryTile icon="LandPlot" label="Terrenos" count={45} active/></div>
<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}><LocationCard name="Monterrey" region="Nuevo León" image="../../assets/img/monterrey.jpg" count={42}/><LocationCard name="CDMX" region="Ciudad de México" image="../../assets/img/cdmx.jpg" count={96}/><LocationCard name="Mérida" region="Yucatán" image="../../assets/img/merida.jpg" count={28}/></div>
<div className="dark" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16}}><StatBlock value="+500" label={<>Propiedades<br/>disponibles</>}/><StatBlock value="+10" label={<>Años de<br/>experiencia</>}/><TrustItem icon="ShieldCheck" title="Propiedades verificadas" subtitle="100% confiables"/><TrustItem icon="Headset" title="Asesoría personalizada" subtitle="Expertos a tu servicio"/></div>
<PropertySpecs variant="blocks" beds={4} baths={4.5} area={320} parking={3}/>
<div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:1,background:'var(--border-1)',border:'1px solid var(--border-1)'}}>{[['Waves','Alberca'],['Trees','Jardín'],['Sun','Terraza'],['ShieldCheck','Seguridad'],['Dumbbell','Gimnasio']].map(([i,l])=><AmenityItem key={l} icon={i} label={l}/>)}</div>
<CompareTray fixed={false} items={P} onRemove={()=>{}} onClear={()=>{}} onCompare={()=>{}}/>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
