<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Core</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:24px;background:var(--bg-page)}.r{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:18px}.lbl{font:500 11px/1 var(--font-sans);color:var(--fg-3);letter-spacing:.04em;width:90px;flex-shrink:0}.dark{background:var(--bg-inverse);padding:18px;border-radius:4px}</style></head><body><div id="root"></div><script type="text/babel">const { Button, IconButton, Badge, Chip, Icon, Logo } = window.MextasDesignSystem_8aabb9;
function App(){const [fav,setFav]=React.useState(true);const [sel,setSel]=React.useState(['Alberca']);const t=(a)=>setSel(s=>s.includes(a)?s.filter(x=>x!==a):[...s,a]);
return <div className="col">
<div className="r"><span className="lbl">Button</span><Button iconRight="ArrowRight">Ver propiedades</Button><Button variant="dark" iconRight="Search">Buscar propiedades</Button><Button variant="outline" size="sm" iconRight="ArrowRight">Ver todas</Button><Button variant="ghost" size="sm">Limpiar</Button><Button variant="link" iconRight="ArrowRight">Ver propiedad</Button></div>
<div className="r"><span className="lbl">States</span><Button variant="dark" loading>Enviando…</Button><Button disabled>Deshabilitado</Button><Button size="lg" iconRight="ArrowRight">Quiero vender</Button></div>
<div className="r dark"><Logo tone="light" size="sm"/><span style={{flex:1}}/><Button variant="outline-inverse" size="sm">Explorar desarrollos</Button><IconButton icon="Heart" label="Favorito" variant="glass" active={fav} onClick={()=>setFav(!fav)}/><IconButton icon="Share2" label="Compartir" variant="dark"/></div>
<div className="r"><span className="lbl">IconButton</span><IconButton icon="Heart" label="Favorito" active={fav} onClick={()=>setFav(!fav)}/><IconButton icon="Share2" label="Compartir"/><IconButton icon="ChevronLeft" label="Anterior" size="lg"/><IconButton icon="X" label="Cerrar" variant="ghost"/><IconButton icon="Heart" label="Favoritos" variant="ghost" count={3}/></div>
<div className="r"><span className="lbl">Badge</span><Badge>Destacada</Badge><Badge>Nueva</Badge><Badge tone="light">Premium</Badge><Badge tone="ink">Preventa</Badge><Badge tone="success">Disponible</Badge><Badge tone="warning">Apartado</Badge><Badge tone="danger">Vendido</Badge></div>
<div className="r"><span className="lbl">Chip</span>{['Alberca','Terraza','Jardín'].map(a=><Chip key={a} selected={sel.includes(a)} onClick={()=>t(a)}>{a}</Chip>)}<Chip icon="MapPin" onRemove={()=>{}}>Polanco · Miguel Hidalgo</Chip></div>
<div className="r"><span className="lbl">Icon</span>{['House','BedDouble','Bath','Square','Car','MapPin','Waves','ShieldCheck','Phone','Calendar'].map(n=><Icon key={n} name={n} size={20} color="var(--accent-text)"/>)}</div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
